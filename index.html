const STORAGE='aozora-license-master-v1'; // preserve previous study records
const REVIEW_STORAGE='aozora-license-review-reports-v3';
const DAY=86400000;
const isoDay=t=>new Date(t).toISOString().slice(0,10);
const conceptOf=q=>q.concept||q.id;
const uniqueCount=arr=>new Set(arr.map(conceptOf)).size;
function conceptHistory(id){const byId=new Map(questions(id).map(q=>[q.id,q]));const hist=new Map();for(const a of records(id)){const q=byId.get(a.qid);if(!q)continue;const k=conceptOf(q);if(!hist.has(k))hist.set(k,[]);hist.get(k).push(a)}return hist}
function reviewState(id){const all=conceptHistory(id),now=Date.now(),byConcept=new Map();for(const [concept,items] of all){let streak=0;for(let i=items.length-1;i>=0;i--){if(!items[i].correct)break;streak++}const last=items[items.length-1];const days=last.correct?([1,3,7,14,30][Math.min(Math.max(0,streak-1),4)]):0;const dueAt=Number(last.time)+days*DAY;byConcept.set(concept,{last,streak,dueAt,due:dueAt<=now,days});}return byConcept}
function reviewSummary(id){const state=reviewState(id),all=new Set(questions(id).map(conceptOf));let due=0,seen=0,retained=0;for(const k of all){const r=state.get(k);if(!r)continue;seen++;if(r.due)due++;if(r.streak>=2&&!r.due)retained++}return{total:all.size,seen,due,newTopics:all.size-seen,retained}}
function availablePool(id){return questions(id).filter(q=>!save.quarantined[q.id])}
function wrongConcepts(id){
 const latest=new Map(),byId=new Map(questions(id).map(q=>[q.id,q]));
 for(const a of records(id)){const q=byId.get(a.qid);if(q)latest.set(conceptOf(q),{answer:a,q});}
 return [...latest.values()].filter(v=>!v.answer.correct);
}
function mistakeReasons(id){const vals=Object.entries(save.mistakeTags||{}),ids=new Set(questions(id).map(q=>q.id)),counts={};
 for(const [qid,reason] of vals){if(ids.has(qid))counts[reason]=(counts[reason]||0)+1;}return counts;
}
function qualitySnapshot(id){const qs=questions(id);const approved=qs.filter(q=>q.reviewStatus==='expert-verified'),partial=qs.filter(q=>q.reviewStatus==='calculation-checked');return {total:qs.length,approved:approved.length,partial:partial.length,unverified:qs.length-approved.length-partial.length};}
function themeRecommendations(id){const pool=availablePool(id),r=reviewState(id),bySection=new Map();for(const q of pool){const st=bySection.get(q.section)||{name:q.section,total:new Set(),done:new Set(),due:new Set(),wrong:new Set()};const key=conceptOf(q);st.total.add(key);const status=r.get(key);if(status){st.done.add(key);if(status.due)st.due.add(key);if(!status.last.correct)st.wrong.add(key)}bySection.set(q.section,st)}return [...bySection.values()].map(st=>({...st,score:st.wrong.size*5+st.due.size*3+(st.total.size-st.done.size)})).sort((a,b)=>b.score-a.score)}
function safePlan(id){const p=save.studyPlan[id]||{};return{date:/^\d{4}-\d{2}-\d{2}$/.test(p.date||'')?p.date:'',minutes:[15,20,30,45,60,90].includes(Number(p.minutes))?Number(p.minutes):30}}
function formatDayCount(date){if(!date)return '未設定';const end=new Date(date+'T23:59:59');const d=Math.ceil((end-Date.now())/DAY);return d>=0?'試験目標まで '+d+' 日':'設定日から '+Math.abs(d)+' 日経過'}

function reportQuestion(q){const why=prompt('この問題の問題点を入力してください（例：正答が違う／選択肢が曖昧／根拠不明）');if(!why||!why.trim())return;reports.push({id:q.id,reason:why.trim().slice(0,500),time:new Date().toISOString()});try{localStorage.setItem(REVIEW_STORAGE,JSON.stringify(reports))}catch{}alert('この端末内に報告を記録しました。設定画面から書き出して確認できます。自動送信はしません。')}
function selectBalanced(pool,cap){const bySection=new Map();for(const q of shuffle(pool)){if(!bySection.has(q.section))bySection.set(q.section,[]);bySection.get(q.section).push(q)}const chosen=[],seen=new Set(),keys=[...bySection.keys()];let advanced=true;while(chosen.length<cap&&advanced){advanced=false;for(const section of shuffle(keys)){const items=bySection.get(section);while(items.length&&seen.has(conceptOf(items[0])))items.shift();if(items.length&&chosen.length<cap){const q=items.shift();chosen.push(q);seen.add(conceptOf(q));advanced=true}}}return chosen;}

const credential=(id)=>credentials().find(x=>x.id===id);

function analysis(id){const q=questions(id),rec=records(id),latest={};for(const x of rec)latest[x.qid]=x;const attempts=rec.length,correct=rec.filter(x=>x.correct).length,mastered=q.filter(x=>latest[x.id]?.correct).length;return {q,attempts,correct,percent:attempts?Math.round(100*correct/attempts):0,mastered,latest}}
function conceptAnalysis(id){const pool=questions(id),lookup=new Map(pool.map(q=>[q.id,conceptOf(q)])),latest={};for(const record of records(id)){const key=lookup.get(record.qid);if(key)latest[key]=record;}const count=uniqueCount(pool);return{count,correct:Object.values(latest).filter(r=>r.correct).length,attempted:Object.keys(latest).length}}
function sectionStats(id){const a=analysis(id),o={};for(const x of a.q){o[x.section]??={n:0,done:0,good:0};o[x.section].n++;if(a.latest[x.id]){o[x.section].done++;if(a.latest[x.id].correct)o[x.section].good++}}return o}
function dateText(v){return new Date(v).toLocaleString('ja-JP',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}
function shuffle(items){const out=[...items];for(let i=out.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[out[i],out[j]]=[out[j],out[i]]}return out}
const btn=(text,fn,cls='btn')=>{let x=el('button',cls,h(text));x.type='button';x.addEventListener('click',fn);return x};
function html(s){$('#content').innerHTML=s}
function node(s){const tmp=document.createElement('div');tmp.innerHTML=s;return tmp.firstElementChild}
function navigate(next,id){if(quiz&&next!=='quiz'){if(!confirm('演習を途中終了します。未回答の問題は記録されません。よろしいですか？'))return;stopTimer();quiz=null}page=next;if(id)active=id;render();window.scrollTo({top:0,behavior:'instant'})}

function drawNav(){const options=[['home','⌂','ホーム'],['courses','▦','資格'],['weak','◎','復習'],['history','▤','記録'],['mistakes','✎','誤答'],['settings','⚙','設定']];const nav=$('.nav');nav.innerHTML='';options.forEach(([id,icon,name])=>{const x=btn(`<span>${icon}</span>${name}`,()=>navigate(id),'navbtn');x.innerHTML=`<span>${icon}</span>${name}`;if(page===id||(['course','quiz','result','skills'].includes(page)&&id==='courses'))x.classList.add('active');nav.append(x)})}

function home(){const all=credentials(),done=all.filter(x=>analysis(x.id).attempts>0).length,total=save.answers.length,totalCorrect=save.answers.filter(x=>x.correct).length;html(`<section class="hero card"><span class="tag good">危険物乙4は対象外・別アプリ</span><h2>資格の勉強を、<br>毎日の力に。</h2><p>問題演習・解説・公式関連リンク・弱点復習・模擬試験・実技チェックを一画面に。学習データはこの端末に保存します。</p><div class="btnrow"><button id="start" class="btn primary">おすすめ学習を開始 →</button><button id="browse" class="btn secondary">資格一覧を見る</button></div></section><div class="metrics"><div class="card"><strong>${all.length}</strong><span>資格コース</span></div><div class="card"><strong>${done}</strong><span>学習開始済み</span></div><div class="card"><strong>${total}</strong><span>累計回答数</span></div><div class="card"><strong>${total?Math.round(totalCorrect/total*100):0}%</strong><span>累計正答率</span></div></div><section class="card" id="todayAgenda"></section><div class="heading"><h2>学習コース</h2><span class="muted small">コースを選んで開始</span></div><div id="homecourses" class="tiles"></div><div class="notice">全1,130問の練習教材ですが、同一テーマの言い換えを多数含みます。テーマ重複を抑えた模試は同一テーマの重複を排除し、分野ごとに均等に選出します。すべて専門家未監修のため、合否を保証するものではありません。</div>`);
$('#start').onclick=()=>navigate('course',active);$('#browse').onclick=()=>navigate('courses');all.forEach(c=>$('#homecourses').append(courseTile(c)));const rs=reviewSummary(active),pl=safePlan(active),rec=themeRecommendations(active)[0];$('#todayAgenda').innerHTML=`<div class="row"><h3>今日の学習ミッション</h3><span class="tag good">進化版 v6</span></div><p class="muted small">${h(credential(active)?.name||'資格')} · ${h(formatDayCount(pl.date))} · 1日${pl.minutes}分の目標</p><div class="metrics"><div><strong>${rs.due}</strong><span>期限到来の復習テーマ</span></div><div><strong>${rs.newTopics}</strong><span>未着手テーマ</span></div><div><strong>${dayRecordCount()}</strong><span>今日の回答</span></div></div><p class="small">おすすめ分野：<b>${h(rec?.name||'学習コースを選択')}</b></p><div class="btnrow"><button class="btn primary" id="agendaStudy">今日の復習を始める</button><button class="btn" id="agendaPlan">学習計画を設定</button></div>`;$('#agendaStudy').onclick=()=>navigate('course',active);$('#agendaPlan').onclick=()=>navigate('course',active)}
function courseTile(c){const a=analysis(c.id),ca=conceptAnalysis(c.id),percent=ca.count?Math.round(ca.correct/ca.count*100):0;const x=el('button','tile');x.innerHTML=`<div class="tile-top"><span class="emoji">${h(c.icon||'📘')}</span><span class="tag">${h(c.type||'学科')}</span></div><h3>${h(c.name)}</h3><p>収録 ${a.q.length} 問 · 独立テーマ ${uniqueCount(a.q)} · 習得 ${ca.correct} テーマ</p><div class="progress"><i style="width:${percent}%"></i></div><span class="sub">習得率 ${percent}%</span>`;x.onclick=()=>navigate('course',c.id);return x}

function startQuiz(mode){
const sec=$('#sec')?.value||'all',amount=$('#amount')?.value||'30';

const a=analysis(active),latestByConcept={};for(const r of records(active)){const question=questions(active).find(x=>x.id===r.qid);if(question)latestByConcept[conceptOf(question)]=r;}
let cap=mode==='exam'?Math.min(credential(active).exam?.count||30,uniqueCount(pool)):amount==='all'?pool.length:Math.min(pool.length,Number(amount));
if(mode==='exam'||mode==='due'||mode==='wrong'){
// One question per learning objective; across sections, sample evenly.
pool=selectBalanced(pool,cap);cap=pool.length;
}else if(mode==='weak'){
// Knowledge-point-level weakness matters more than repetitions of an already-correct answer.
pool=shuffle(pool).sort((x,y)=>{const r=q=>latestByConcept[conceptOf(q)];const weight=q=>r(q)?(r(q).correct?2:0):1;return weight(x)-weight(y)});
const seen=new Set(),first=[],rest=[];for(const q of pool){const k=conceptOf(q);if(seen.has(k))rest.push(q);else{first.push(q);seen.add(k)}}pool=[...first,...rest].slice(0,cap);
}else{
const seen=new Set(),first=[],rest=[];for(const q of shuffle(pool)){const k=conceptOf(q);if(seen.has(k))rest.push(q);else{first.push(q);seen.add(k)}}pool=[...first,...rest].slice(0,cap);
}
quiz={mode,id:active,pool:pool.map(q=>({q,choices:shuffle(q.choices.map((value,index)=>({value,index}))),selected:null})),index:0,started:Date.now(),endsAt:mode==='exam'?Date.now()+Math.min(credential(active).exam?.minutes||60,120)*60000:null};page='quiz';render();if(mode==='exam')startTimer();
}

 $('#mistakeExport').onclick=()=>{const lines=['"問題ID","分野","問題","理由","最終回答日"',...items.map(v=>[v.q.id,v.q.section,v.q.question,save.mistakeTags[v.q.id]||'',new Date(v.answer.time).toISOString().slice(0,10)].map(csvEscape).join(','))];download('aozora-mistakes-'+active+'.csv','\uFEFF'+lines.join('\r\n'),'text/csv;charset=utf-8')};
 const out=$('#mistakeList');if(!items.length){out.innerHTML='<div class="card empty">現在の誤答テーマはありません。演習から学習を開始してください。</div>';return;}
 for(const {q,answer} of items.slice(0,200)){const d=el('div','card');d.innerHTML=`<div class="row"><span class="tag warn">${h(q.section)}</span><span class="small muted">${h(save.mistakeTags[q.id]||'原因未登録')}</span></div><p><b>${h(q.question)}</b></p><p class="small">正解：${h(q.choices[q.answer])}</p><p class="small muted">${h(q.explanation)}</p><span class="small muted">教材の個別監修：${q.reviewStatus==='expert-verified'?'検証済み': '未検証'} ／ ${h(new Date(answer.time).toLocaleDateString('ja-JP'))}</span>`;out.append(d)}
}
function historyPage(){html(`<div class="heading"><h2>学習履歴</h2><button class="btn" id="export">バックアップ</button></div><div class="metrics"><div class="stat"><b>${save.sessions.length}</b><span>演習回数</span></div><div class="stat"><b>${save.answers.length}</b><span>累計回答</span></div><div class="stat"><b>${new Set(save.answers.map(x=>new Date(x.time).toDateString())).size}</b><span>学習日数</span></div><div class="stat"><b>${save.answers.filter(x=>x.correct).length}</b><span>正解数</span></div></div><div id="sessions" class="card"></div>`);$('#export').onclick=exportBackup;const box=$('#sessions');if(!save.sessions.length){box.innerHTML='<div class="empty">まだ履歴はありません。コースから学習を開始してください。</div>';return}for(const s of save.sessions){const x=el('div','history');const percent=s.answered?Math.round(s.correct/s.answered*100):0;x.innerHTML=`<div class="row"><div><b>${h(credential(s.credential)?.name||s.credential)}</b><div class="muted small">${dateText(s.ended)} · ${s.mode==='exam'?'模試':s.mode==='weak'?'弱点演習':'通常演習'}</div></div><div><b>${percent}%</b><div class="muted small">${s.correct}/${s.answered} 問</div></div></div>`;x.onclick=()=>{review=s;page='result';render()};x.style.cursor='pointer';box.append(x)}}
function download(name,data,mime='application/json'){const blob=new Blob([data],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportBackup(){download('aozora-license-backup-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({app:'AOZORA_LICENSE_MASTER',schema:1,exported:new Date().toISOString(),save},null,2))}
function csvEscape(s){return '"'+String(s??'').replaceAll('"','""')+'"'}
function exportCSV(){const lines=['"日時","資格","分野","問題ID","正誤","モード"',...save.answers.map(x=>[dateText(x.time),credential(x.credential)?.name||x.credential,x.section,x.qid,x.correct?'正解':'不正解',x.mode].map(csvEscape).join(','))];download('aozora-license-history.csv','\uFEFF'+lines.join('\r\n'),'text/csv;charset=utf-8')}
function allowedUrl(x){try{const a=new URL(x);return a.protocol==='https:'?a.href:null}catch{return null}}
function validateExtension(obj){if(!obj||typeof obj!=='object'||!Array.isArray(obj.credentials)||!Array.isArray(obj.questions))throw Error('credentials配列とquestions配列が必要です。');if(obj.credentials.length>30||obj.questions.length>3000)throw Error('一度に追加できる上限を超えています。');const allIds=new Set(credentials().map(x=>x.id)),addIds=new Set(),add=[];for(let i=0;i<obj.credentials.length;i++){const c=obj.credentials[i];if(!/^[a-z0-9_-]{2,35}$/.test(c.id)||allIds.has(c.id)||addIds.has(c.id)||typeof c.name!=='string'||!c.name.trim())throw Error('資格IDの重複、形式または名称に問題があります。');if(c.id.toLowerCase().includes('otsu4')||c.name.includes('危険物'))throw Error('危険物取扱者は別アプリのため追加できません。');addIds.add(c.id);add.push({id:c.id,name:c.name.slice(0,70),short:String(c.short||c.name).slice(0,24),icon:String(c.icon||'📘').slice(0,3),type:'追加資格',source:allowedUrl(c.source)||'https://www.mhlw.go.jp/',sections:[],exam:{count:0,minutes:60,pass:0,mode:'独自演習'}})}const validIds=new Set([...allIds,...addIds]),qids=new Set(questions().map(q=>q.id)),qadd=[];for(let i=0;i<obj.questions.length;i++){let q=obj.questions[i];if(typeof q.id!=='string'||qids.has(q.id)||!validIds.has(q.credential)||!Array.isArray(q.choices)||q.choices.length!==4||q.choices.some(s=>typeof s!=='string'||!s.trim())||!Number.isInteger(q.answer)||q.answer<0||q.answer>3||typeof q.question!=='string'||!q.question.trim()||typeof q.explanation!=='string'||!q.explanation.trim())throw Error(`問題${i+1}に形式エラーまたは重複があります。`);qids.add(q.id);qadd.push({id:q.id.slice(0,90),credential:q.credential,section:String(q.section||'一般').slice(0,60),question:q.question.slice(0,600),choices:q.choices.map(s=>s.slice(0,300)),answer:q.answer,explanation:q.explanation.slice(0,1500),source:allowedUrl(q.source)||credential(q.credential)?.source||add.find(x=>x.id===q.credential)?.source,kind:'imported'})}return{add,qadd}}
function makeBankAudit(){const all=questions(),seen=new Set(),duplicates=[],issues=[],stats={};for(const q of all){if(seen.has(q.id))duplicates.push(q.id);seen.add(q.id);if(!Array.isArray(q.choices)||q.choices.length!==4||new Set(q.choices).size!==4||!Number.isInteger(q.answer)||q.answer<0||q.answer>3||!q.explanation)issues.push(q.id);const v=stats[q.credential]??={questions:0,concepts:new Set(),bySection:{},unreviewed:0};v.questions++;v.concepts.add(conceptOf(q));v.bySection[q.section]=(v.bySection[q.section]||0)+1;if(q.reviewStatus!=='expert-verified')v.unreviewed++}const summary={};for(const [key,v]of Object.entries(stats)){summary[key]={questions:v.questions,uniqueConcepts:v.concepts.size,unverified:v.unreviewed,bySection:v.bySection}}return{version:'6.0',generated:new Date().toISOString(),questions:all.length,duplicateIDs:duplicates,formatIssues:issues,summary,notice:'形式検査であり、解答の正しさ・実技・出題基準への適合を保証しません。'}}
function settingsPage(){html(`<div class="heading"><h2>設定・教材拡張</h2></div><section class="card"><h3>学習データの管理</h3><p class="muted small">端末内の保存データはブラウザの削除・機種変更で消える場合があります。定期的にバックアップを保存してください。</p><div class="btnrow"><button id="backup" class="btn primary">JSONバックアップ</button><button id="csv" class="btn">学習履歴CSV</button><label class="btn" for="restore" style="cursor:pointer;margin:0">バックアップを復元</label><input id="restore" type="file" accept=".json,application/json" hidden></div><p class="small muted">復元は現在の学習履歴を上書きします。</p></section><section class="card" style="margin-top:14px"><h3>資格・問題を追加</h3><p class="small muted">JSON形式の教材を追加できます。資格IDは英小文字・数字・ハイフン、問題は4択・解説・参照URLを含めます。</p><div class="btnrow"><button id="sample" class="btn">追加用テンプレートを取得</button><label class="btn" for="import" style="cursor:pointer;margin:0">問題JSONを読み込む</label><input id="import" type="file" accept=".json,application/json" hidden></div><div id="importStatus" class="small muted"></div></section><section class="card" style="margin-top:14px"><h3>問題品質管理</h3><p class="small muted">出題停止した問題 ${Object.values(save.quarantined).filter(Boolean).length}問／保存した問題 ${Object.values(save.bookmarks).filter(Boolean).length}問。停止はこの端末だけに適用され、教材そのものは削除されません。</p><div class="btnrow"><button id="auditExport" class="btn">問題品質レポート出力</button><button id="bankAudit" class="btn">教材データ監査JSON</button><button id="clearQuarantine" class="btn">停止した問題をすべて解除</button></div></section><section class="card" style="margin-top:14px"><h3>収録内容と透明性</h3><p class="small">学習中に記録した誤り報告：<b>${reports.length}件</b>　<button id="exportReports" class="btn">誤り報告をJSON出力</button></p><p class="muted small">問題は独自制作で、公式過去問の転載ではありません。場面別に同じ学習テーマを繰り返す反復問題が含まれます。公式の出題範囲を確認するための関連資料リンクを表示します。法令改正や試験方式の変更は自動反映されません。AI APIによるリアルタイム生成はこの静的版には含まれません。</p><p class="small">問題バンク: <b>${questions().length} 問</b> / 資格: <b>${credentials().length} コース</b></p><div class="btnrow"><button id="reset" class="btn danger">学習履歴を初期化</button></div></section>`);$('#bankAudit').onclick=()=>download('aozora-bank-audit.json',JSON.stringify(makeBankAudit(),null,2));$('#auditExport').onclick=()=>download('aozora-quality-review.json',JSON.stringify({generated:new Date().toISOString(),version:'6.0',reported:reports,quarantined:Object.keys(save.quarantined).filter(k=>save.quarantined[k]),bookmarked:Object.keys(save.bookmarks).filter(k=>save.bookmarks[k]),notice:'関連リンクは個別設問の正答証拠ではありません。'},null,2));$('#clearQuarantine').onclick=()=>{if(confirm('出題停止した問題をすべて復帰しますか？')){save.quarantined={};persist();render()}};$('#backup').onclick=exportBackup;$('#csv').onclick=exportCSV;$('#exportReports').onclick=()=>download('license-question-reports.json',JSON.stringify(reports,null,2));$('#sample').onclick=()=>download('extension-template.json',JSON.stringify({credentials:[{id:'sample_license',name:'サンプル追加資格',icon:'📗',source:'https://www.mhlw.go.jp/'}],questions:[{id:'sample-001',credential:'sample_license',section:'基礎',question:'サンプル問題です。正解はどれ？',choices:['正解','誤答1','誤答2','誤答3'],answer:0,explanation:'正解と根拠をここに記載します。',source:'https://www.mhlw.go.jp/'}]},null,2));$('#reset').onclick=()=>{if(confirm('本当に学習履歴と実技チェックを削除しますか？追加した資格・問題は残ります。')){save.answers=[];save.sessions=[];save.skills={};persist();render()}};$('#restore').onchange=e=>readJSON(e.target.files[0],obj=>{if(obj.app!=='AOZORA_LICENSE_MASTER'||!obj.save||!Array.isArray(obj.save.answers)||!Array.isArray(obj.save.sessions)||!Array.isArray(obj.save.customQuestions)||!Array.isArray(obj.save.customCredentials))throw Error('正しいバックアップ形式ではありません。');if(!confirm('学習記録をこのバックアップで上書きします。よろしいですか？'))return;save={...defaultSave(),...obj.save};save.bookmarks??={};save.quarantined??={};save.studyPlan??={};save.mistakeTags??={};persist();render();alert('復元しました。')});$('#import').onchange=e=>readJSON(e.target.files[0],obj=>{const {add,qadd}=validateExtension(obj);save.customCredentials.push(...add);save.customQuestions.push(...qadd);persist();render();alert(`${add.length}資格・${qadd.length}問を追加しました。`)})}
function readJSON(file,fn){if(!file)return;if(file.size>3_000_000)return alert('ファイルは3MB以下にしてください。');const r=new FileReader();r.onload=()=>{try{fn(JSON.parse(r.result))}catch(e){alert('読み込み失敗: '+e.message)}};r.onerror=()=>alert('ファイルを読み込めませんでした。');r.readAsText(file,'utf-8')}
async function init(){try{bank=EMBEDDED_BANK;if(!Array.isArray(bank.credentials)||!Array.isArray(bank.questions))throw Error('教材形式が不正');layout();render();}catch(e){document.getElementById('app').innerHTML=`<div class="app-shell"><section class="card" style="margin-top:30px"><h2>起動できませんでした</h2><p>${h(e.message)}</p><p>GitHub Pagesで公開して開いてください。ZIP内のindex.htmlを「ファイル」アプリから直接開くと、教材JSONを読み込めない場合があります。</p><button class="btn" onclick="location.reload()">再試行</button></section></div>`}}
init();
</script></body></html>
